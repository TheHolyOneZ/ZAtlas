name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the draft release tag, e.g. 0.1.0'
        required: true
        default: '0.1.0'
      draft_release:
        description: 'Also attach the installer to a draft release'
        type: boolean
        required: false
        default: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - name: Build the CLI
        run: |
          cargo build --release -p zatlas-cli
          Copy-Item target\release\zatlas.exe zatlas-windows-x86_64.exe

      - name: Show what was produced
        shell: pwsh
        run: |
          Get-ChildItem -Recurse target\release\bundle\nsis |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize
          Get-ChildItem zatlas-windows-x86_64.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target\release\bundle\nsis\*.exe, zatlas-windows-x86_64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }
          Get-Content SHA256SUMS.txt

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zatlas-windows
          path: |
            target/release/bundle/nsis/*.exe
            zatlas-windows-x86_64.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to a draft release
        if: ${{ inputs.draft_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ZAtlas v${{ inputs.version }}
          draft: true
          prerelease: false
          files: |
            target/release/bundle/nsis/*.exe
            zatlas-windows-x86_64.exe
            SHA256SUMS.txt
          body: |
            Windows build from `${{ github.sha }}`.

            `ZAtlas_${{ inputs.version }}_x64-setup.exe` is the desktop installer.
            `zatlas-windows-x86_64.exe` is the standalone command-line binary.

            Put them in `zatlas/releases/`, then delete this draft.
